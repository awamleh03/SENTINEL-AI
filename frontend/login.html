<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B14;
      --card: #0F1629;
      --border: rgba(255,255,255,0.08);
      --primary: #6366F1;
      --primary-hover: #818CF8;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --danger: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .auth-wrap { width: 100%; max-width: 400px; position: relative; }
    .lang-switch {
      position: absolute;
      top: -8px;
      right: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-switch:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }
    [dir="rtl"] .lang-switch {
      right: auto;
      left: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }
    .brand strong { display: block; font-size: 1rem; font-weight: 700; }
    .brand span { font-size: 0.7rem; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0A0F1A;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .forgot-row {
      text-align: right;
      margin: -8px 0 20px;
    }
    [dir="rtl"] .forgot-row { text-align: left; }
    .forgot-row a {
      font-size: 0.8rem;
      color: #818CF8;
      text-decoration: none;
    }
    .forgot-row a:hover { text-decoration: underline; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footer a { color: #818CF8; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <button type="button" class="lang-switch" id="langSwitch">العربية</button>

    <div class="brand">
      <div class="brand-icon">🛡</div>
      <div>
        <strong>SENTINEL-AI</strong>
        <span data-i18n="brand_sub">Control Center</span>
      </div>
    </div>

    <div class="card">
      <h1 data-i18n="title">Welcome back</h1>
      <p class="sub" data-i18n="sub">Sign in to continue to your dashboard</p>

      <form id="loginForm">
        <label data-i18n="label_id">Username or email</label>
        <input type="text" name="identifier" autocomplete="username" required data-i18n-placeholder="ph_id" placeholder="you@example.com or username" />

        <label data-i18n="label_pass">Password</label>
        <input type="password" name="password" autocomplete="current-password" required minlength="8" placeholder="••••••••" />

        <div class="forgot-row">
          <a href="forgot-password.html" data-i18n="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" data-i18n="btn_login">Sign in</button>
        <a href="dashboard.html" class="btn btn-ghost" data-i18n="btn_guest">Continue as guest</a>
        <p class="error" id="loginError"></p>
      </form>
    </div>

    <div class="footer">
      <span data-i18n="no_account">Don't have an account?</span>
      <a href="register.html" data-i18n="create">Create one</a>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        brand_sub: "Control Center",
        title: "Welcome back",
        sub: "Sign in to continue to your dashboard",
        label_id: "Username or email",
        ph_id: "you@example.com or username",
        label_pass: "Password",
        forgot: "Forgot password?",
        btn_login: "Sign in",
        btn_guest: "Continue as guest",
        no_account: "Don't have an account?",
        create: "Create one",
        switch_btn: "العربية"
      },
      ar: {
        brand_sub: "مركز التحكم",
        title: "مرحباً بعودتك",
        sub: "سجّل الدخول للمتابعة إلى لوحة التحكم",
        label_id: "اسم المستخدم أو البريد",
        ph_id: "you@example.com أو اسم المستخدم",
        label_pass: "كلمة المرور",
        forgot: "نسيت كلمة المرور؟",
        btn_login: "تسجيل الدخول",
        btn_guest: "المتابعة كزائر",
        no_account: "ما عندك حساب؟",
        create: "أنشئ حساب",
        switch_btn: "English"
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);

      const html = document.documentElement;
      html.lang = lang;
      html.dir = lang === 'ar' ? 'rtl' : 'ltr';

      const t = translations[lang];

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });

      document.getElementById('langSwitch').textContent = t.switch_btn;
    }

    document.getElementById('langSwitch').addEventListener('click', () => {
      applyLang(currentLang === 'en' ? 'ar' : 'en');
    });

    // تطبيق اللغة المحفوظة عند فتح الصفحة
    applyLang(currentLang);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const identifier = form.identifier.value.trim();
      const password = form.password.value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        // === اربط هنا API تسجيل الدخول تبعك ===
        // مثال:
        // const res = await fetch('/api/auth/login', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify({ identifier, password })
        // });
        // const data = await res.json();
        // if (!res.ok) throw new Error(data.message || 'Login failed');
        // localStorage.setItem('token', data.token);

        // مؤقتاً للتجربة:
        console.log('Login:', identifier);
        localStorage.setItem('token', 'demo-token');
        localStorage.setItem('user', JSON.stringify({ username: identifier }));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Something went wrong';
      }
    });
  </script>
</body>
</html>
