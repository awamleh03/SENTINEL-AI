<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#070B14; --card:#0F1629; --elevated:#0C1220;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --primary:#6366F1; --primary-hover:#818CF8;
  --text:#F8FAFC; --muted:#94A3B8; --dim:#64748B;
  --success:#10B981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,0.12),transparent),var(--bg);
  color:var(--text); min-height:100vh; line-height:1.55;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.35)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366F1,#4F46E5);display:grid;place-items:center}
.brand-icon svg{width:20px;height:20px;color:#fff}
.brand-text strong{display:block;font-size:0.95rem}
.brand-text span{font-size:0.7rem;color:var(--dim)}
h1{font-size:1.35rem;font-weight:700;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:18px}
.form-group{margin-bottom:14px}
label{display:block;font-size:0.78rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-control{width:100%;background:var(--elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px;color:var(--text);font-size:0.9rem;outline:none;font-family:inherit}
.form-control:focus{border-color:rgba(99,102,241,.55);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;font-size:0.95rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.6;cursor:default}
.btn-ghost{width:100%;margin-top:10px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--border-strong);color:var(--muted);font-weight:500;cursor:pointer;font-family:inherit;font-size:0.9rem}
.btn-ghost:hover{border-color:rgba(99,102,241,.4);color:var(--text)}
.hint{font-size:0.78rem;color:var(--dim);line-height:1.5;margin-top:16px;text-align:center}
.info{margin-bottom:16px;padding:12px 14px;border-radius:12px;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.25);color:var(--muted);font-size:0.84rem}
.ok{display:none;margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#34d399;font-size:0.88rem}
.ok.show{display:block}
.err{display:none;margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171;font-size:0.88rem}
.err.show{display:block}
.step{display:none}
.step.active{display:block}
.lang{position:fixed;top:16px;inset-inline-start:16px;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:0.78rem;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <button class="lang" id="langBtn" type="button" onclick="toggleLang()">English</button>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/></svg></div>
      <div class="brand-text"><strong>SENTINEL-AI</strong><span id="brandSub">مركز التحكم</span></div>
    </div>
    <h1 id="title">استعادة كلمة المرور</h1>
    <p class="sub" id="subtitle">أدخل بريدك المسجّل لبدء الاستعادة</p>
    <div class="info" id="infoBox">سنرسل رمزاً إلى بريدك إن كان مسجّلاً. الرمز صالح لمرة واحدة فقط.</div>
    <div class="ok" id="okBox"></div>
    <div class="err" id="errBox"></div>

    <form id="reqForm" class="step active">
      <div class="form-group">
        <label id="lblEmail">البريد الإلكتروني</label>
        <input class="form-control" id="email" type="email" required placeholder="you@company.com" autocomplete="email" />
      </div>
      <button class="btn" type="submit" id="reqBtn"><span id="btnText">إرسال الرمز</span></button>
    </form>

    <form id="resetForm" class="step">
      <div class="form-group">
        <label id="lblToken">رمز الاستعادة</label>
        <input class="form-control" id="token" type="text" required autocomplete="one-time-code" />
      </div>
      <div class="form-group">
        <label id="lblNewPass">كلمة المرور الجديدة</label>
        <input class="form-control" id="newPassword" type="password" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label id="lblConfirm">تأكيد كلمة المرور</label>
        <input class="form-control" id="confirmPassword" type="password" required autocomplete="new-password" />
      </div>
      <button class="btn" type="submit" id="resetBtn"><span id="resetBtnText">تعيين كلمة المرور</span></button>
    </form>

    <button type="button" class="btn-ghost" onclick="location.href='register.html'" id="regBtn">إنشاء حساب جديد</button>
    <button type="button" class="btn-ghost" onclick="location.href='login.html'" id="backBtn">العودة لتسجيل الدخول</button>
    <p class="hint" id="note">إن لم يصلك الرمز، تحقق من البريد المزعج أو تواصل مع مسؤول النظام.</p>
  </div>
<script>
const API='/api/auth';
let lang='ar';
const t={
  ar:{
    title:'استعادة كلمة المرور',sub:'أدخل بريدك المسجّل لبدء الاستعادة',email:'البريد الإلكتروني',btn:'إرسال الرمز',
    token:'رمز الاستعادة',newPass:'كلمة المرور الجديدة',confirm:'تأكيد كلمة المرور',resetBtn:'تعيين كلمة المرور',
    back:'العودة لتسجيل الدخول',reg:'إنشاء حساب جديد',brand:'مركز التحكم',
    info:'سنرسل رمزاً إلى بريدك إن كان مسجّلاً. الرمز صالح لمرة واحدة فقط.',
    note:'إن لم يصلك الرمز، تحقق من البريد المزعج أو تواصل مع مسؤول النظام.',
    okSent:'إذا كان البريد مسجّلاً فقد أُرسل إليه رمز الاستعادة. أدخل الرمز أدناه.',
    okDone:'تم تعيين كلمة المرور بنجاح. جارٍ تحويلك لتسجيل الدخول…',
    errMatch:'كلمتا المرور غير متطابقتين.',errNet:'تعذّر الاتصال بالخادم. حاول مرة أخرى.',errGeneric:'تعذّر إكمال العملية.'
  },
  en:{
    title:'Reset password',sub:'Enter your registered email to start the reset',email:'Email',btn:'Send token',
    token:'Reset token',newPass:'New password',confirm:'Confirm password',resetBtn:'Set password',
    back:'Back to sign in',reg:'Create new account',brand:'Control Center',
    info:'If your email is registered we will send a token. It can be used only once.',
    note:'If you did not receive a token, check spam or contact your system admin.',
    okSent:'If the email is registered, a reset token has been sent. Enter it below.',
    okDone:'Your password has been reset. Redirecting to sign in…',
    errMatch:'The two passwords do not match.',errNet:'Could not reach the server. Please try again.',errGeneric:'The operation could not be completed.'
  }
};
const $=id=>document.getElementById(id);
const okEl=$('okBox'), errEl=$('errBox');
function show(el,msg){el.textContent=msg;el.classList.add('show')}
function hide(el){el.classList.remove('show')}
function hideAll(){hide(okEl);hide(errEl)}
function goStep(step){$('reqForm').classList.toggle('active',step===1);$('resetForm').classList.toggle('active',step===2)}
function apply(){
  const d=t[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent=lang==='ar'?'English':'العربية';
  $('title').textContent=d.title;$('subtitle').textContent=d.sub;$('lblEmail').textContent=d.email;
  $('btnText').textContent=d.btn;$('lblToken').textContent=d.token;$('lblNewPass').textContent=d.newPass;
  $('lblConfirm').textContent=d.confirm;$('resetBtnText').textContent=d.resetBtn;
  $('backBtn').textContent=d.back;$('regBtn').textContent=d.reg;$('brandSub').textContent=d.brand;
  $('infoBox').textContent=d.info;$('note').textContent=d.note;
}
function toggleLang(){lang=lang==='ar'?'en':'ar';apply()}

$('reqForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  hideAll();
  const email=$('email').value.trim();
  if(!email)return;
  const btn=$('reqBtn');btn.disabled=true;
  try{
    const res=await fetch(`${API}/forgot-password`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})
    });
    if(!res.ok)throw new Error('request failed');
    show(okEl,t[lang].okSent);
    goStep(2);
  }catch(_){show(errEl,t[lang].errNet)}
  finally{btn.disabled=false}
});

$('resetForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  hideAll();
  const token=$('token').value.trim();
  const p1=$('newPassword').value;
  const p2=$('confirmPassword').value;
  if(p1!==p2){show(errEl,t[lang].errMatch);return}
  const btn=$('resetBtn');btn.disabled=true;
  try{
    const res=await fetch(`${API}/reset-password`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,new_password:p1})
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      show(okEl,t[lang].okDone);
      setTimeout(()=>location.href='login.html',1500);
    }else{
      const msg=(data.details&&data.details[0])||data.error||t[lang].errGeneric;
      show(errEl,msg);
    }
  }catch(_){show(errEl,t[lang].errNet)}
  finally{btn.disabled=false}
});

// A real reset link carries the token as ?token=... — prefill and jump to step 2.
const preToken=new URLSearchParams(location.search).get('token');
if(preToken){$('token').value=preToken;goStep(2)}
apply();
</script>
</body>
</html>
