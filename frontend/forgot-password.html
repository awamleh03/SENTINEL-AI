<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#070B14; --card:#0F1629; --elevated:#0C1220;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --primary:#6366F1; --primary-hover:#818CF8;
  --text:#F8FAFC; --muted:#94A3B8; --dim:#64748B;
  --success:#10B981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,0.12),transparent),var(--bg);
  color:var(--text); min-height:100vh; line-height:1.55;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.35)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6366F1,#4F46E5);display:grid;place-items:center}
.brand-icon svg{width:20px;height:20px;color:#fff}
.brand-text strong{display:block;font-size:0.95rem}
.brand-text span{font-size:0.7rem;color:var(--dim)}
h1{font-size:1.35rem;font-weight:700;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:18px}
.form-group{margin-bottom:14px}
label{display:block;font-size:0.78rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-control{width:100%;background:var(--elevated);border:1px solid var(--border-strong);border-radius:10px;padding:11px 13px;color:var(--text);font-size:0.9rem;outline:none;font-family:inherit}
.form-control:focus{border-color:rgba(99,102,241,.55);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;font-size:0.95rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--primary-hover)}
.btn-ghost{width:100%;margin-top:10px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--border-strong);color:var(--muted);font-weight:500;cursor:pointer;font-family:inherit;font-size:0.9rem}
.btn-ghost:hover{border-color:rgba(99,102,241,.4);color:var(--text)}
.hint{font-size:0.78rem;color:var(--dim);line-height:1.5;margin-top:16px;text-align:center}
.info{margin-bottom:16px;padding:12px 14px;border-radius:12px;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.25);color:var(--muted);font-size:0.84rem}
.ok{display:none;margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#34d399;font-size:0.88rem}
.ok.show{display:block}
.lang{position:fixed;top:16px;inset-inline-start:16px;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:0.78rem;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <button class="lang" id="langBtn" type="button" onclick="toggleLang()">English</button>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/></svg></div>
      <div class="brand-text"><strong>SENTINEL-AI</strong><span id="brandSub">مركز التحكم</span></div>
    </div>
    <h1 id="title">استعادة كلمة المرور</h1>
    <p class="sub" id="subtitle">أدخل بريدك المسجّل وسنوضح لك الخطوة التالية</p>
    <div class="info" id="infoBox">في النسخة الحالية لا يوجد إرسال بريد تلقائي. أدخل بريدك لتسجيل الطلب، أو أنشئ حساباً جديداً للدخول مباشرة.</div>
    <div class="ok" id="okBox"></div>
    <form id="fpForm">
      <div class="form-group">
        <label id="lblEmail">البريد الإلكتروني</label>
        <input class="form-control" id="email" type="email" required placeholder="you@company.com" autocomplete="email" />
      </div>
      <button class="btn" type="submit"><span id="btnText">تسجيل الطلب</span></button>
    </form>
    <button type="button" class="btn-ghost" onclick="location.href='register.html'" id="regBtn">إنشاء حساب جديد</button>
    <button type="button" class="btn-ghost" onclick="location.href='login.html'" id="backBtn">العودة لتسجيل الدخول</button>
    <p class="hint" id="note">للمستخدمين الحاليين: تواصل مع مسؤول النظام لإعادة التعيين اليدوي حتى يتوفر خادم البريد.</p>
  </div>
<script>
let lang='ar';
const t={
  ar:{title:'استعادة كلمة المرور',sub:'أدخل بريدك المسجّل وسنوضح لك الخطوة التالية',email:'البريد الإلكتروني',btn:'تسجيل الطلب',back:'العودة لتسجيل الدخول',reg:'إنشاء حساب جديد',brand:'مركز التحكم',info:'في النسخة الحالية لا يوجد إرسال بريد تلقائي. أدخل بريدك لتسجيل الطلب، أو أنشئ حساباً جديداً للدخول مباشرة.',note:'للمستخدمين الحاليين: تواصل مع مسؤول النظام لإعادة التعيين اليدوي حتى يتوفر خادم البريد.',ok:(e)=>`تم تسجيل طلب الاستعادة لـ ${e}. حالياً لا يُرسل رابط تلقائي — استخدم إنشاء حساب جديد أو راجع المسؤول.`},
  en:{title:'Reset password',sub:'Enter your registered email and we will guide the next step',email:'Email',btn:'Submit request',back:'Back to sign in',reg:'Create new account',brand:'Control Center',info:'Automatic email delivery is not enabled in this build. Submit your email to log the request, or create a new account.',note:'Existing users: contact the system admin for a manual reset until mail is configured.',ok:(e)=>`Reset request logged for ${e}. No automatic link is sent yet — create a new account or contact admin.`}
};
function apply(){const d=t[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('langBtn').textContent=lang==='ar'?'English':'العربية';document.getElementById('title').textContent=d.title;document.getElementById('subtitle').textContent=d.sub;document.getElementById('lblEmail').textContent=d.email;document.getElementById('btnText').textContent=d.btn;document.getElementById('backBtn').textContent=d.back;document.getElementById('regBtn').textContent=d.reg;document.getElementById('brandSub').textContent=d.brand;document.getElementById('infoBox').textContent=d.info;document.getElementById('note').textContent=d.note}
function toggleLang(){lang=lang==='ar'?'en':'ar';apply()}
document.getElementById('fpForm').addEventListener('submit',(e)=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email)return;const box=document.getElementById('okBox');box.textContent=t[lang].ok(email);box.classList.add('show');try{const k='sentinel_reset_requests';const prev=JSON.parse(localStorage.getItem(k)||'[]');prev.push({email,at:new Date().toISOString()});localStorage.setItem(k,JSON.stringify(prev.slice(-50)))}catch(_){}});
apply();
</script>
</body>
</html>
