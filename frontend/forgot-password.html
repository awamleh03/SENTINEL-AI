<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#070B14; --card:#0F1629; --elevated:#0C1220;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --primary:#6366F1; --primary-hover:#818CF8; --primary-soft:rgba(99,102,241,0.14);
  --text:#F8FAFC; --muted:#94A3B8; --dim:#64748B;
  --success:#10B981; --danger:#EF4444; --warning:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,0.12),transparent),var(--bg);
  color:var(--text); min-height:100vh; line-height:1.55;
  display:flex; align-items:center; justify-content:center; padding:24px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.card{
  width:100%; max-width:420px;
  background:var(--card); border:1px solid var(--border);
  border-radius:18px; padding:28px 26px 24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.brand-icon{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#6366F1,#4F46E5);
  display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(99,102,241,0.4);
}
.brand-icon svg{width:20px;height:20px;color:#fff}
.brand-text{text-align:start}
.brand-text strong{display:block;font-size:0.95rem}
.brand-text span{font-size:0.7rem;color:var(--dim)}
h1{font-size:1.35rem;font-weight:700;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:22px}
.form-group{margin-bottom:14px}
label{display:block;font-size:0.78rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.form-control{
  width:100%; background:var(--elevated); border:1px solid var(--border-strong);
  border-radius:10px; padding:11px 13px; color:var(--text); font-size:0.9rem;
  outline:none; transition:border-color .15s; font-family:inherit;
}
.form-control:focus{border-color:rgba(99,102,241,.55);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{
  width:100%; padding:12px; border:none; border-radius:10px;
  background:var(--primary); color:#fff; font-weight:600; font-size:0.92rem;
  cursor:pointer; transition:.15s; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 6px 18px rgba(99,102,241,0.28);
}
.btn:hover{background:var(--primary-hover);box-shadow:0 8px 22px rgba(99,102,241,0.35)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{
  width:100%; margin-top:10px; padding:11px; border-radius:10px;
  border:1px solid var(--border-strong); background:transparent; color:var(--muted);
  font-weight:600; font-size:0.88rem; cursor:pointer; font-family:inherit;
}
.btn-ghost:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.links{margin-top:18px;text-align:center;font-size:0.84rem;color:var(--muted)}
.links a{color:#A5B4FC;font-weight:500}
.links a:hover{text-decoration:underline}
.err{
  display:none; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35);
  color:#FCA5A5; border-radius:10px; padding:10px 12px; font-size:0.84rem; margin-bottom:14px;
}
.err.show{display:block}
.ok{
  display:none; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35);
  color:#6EE7B7; border-radius:10px; padding:10px 12px; font-size:0.84rem; margin-bottom:14px;
}
.ok.show{display:block}
.hint{font-size:0.75rem;color:var(--dim);margin-top:6px}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.row-between a{font-size:0.8rem;color:#A5B4FC}
.lang{position:fixed;top:16px;left:16px}
html[dir=ltr] .lang{left:auto;right:16px}
.lang button{
  background:rgba(255,255,255,0.04); border:1px solid var(--border);
  color:var(--muted); border-radius:8px; padding:6px 10px; font-size:0.75rem;
  cursor:pointer; font-weight:600;
}
.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  display:none;
}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="lang"><button type="button" id="langBtn" onclick="toggleLang()">English</button></div>
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg></div>
      <div class="brand-text">
        <strong>SENTINEL-AI</strong>
        <span id="brandSub">مركز التحكم</span>
      </div>
    </div>
    <h1 id="title">استعادة كلمة المرور</h1>
    <p class="sub" id="subtitle">أدخل بريدك وسنوضح لك الخطوة التالية</p>
    <div class="err" id="errBox"></div>
    <div class="ok" id="okBox"></div>
    <form id="fpForm">
      <div class="form-group">
        <label id="lblEmail">البريد الإلكتروني</label>
        <input class="form-control" id="email" type="email" required placeholder="you@company.com" />
      </div>
      <button class="btn" id="submitBtn" type="submit">
        <span class="spinner"></span>
        <span class="btn-text" id="btnText">متابعة</span>
      </button>
    </form>
    <button type="button" class="btn-ghost" onclick="location.href='login.html'" id="backBtn">العودة لتسجيل الدخول</button>
    <p class="hint" id="note" style="margin-top:16px;text-align:center">
      حالياً إعادة التعيين عبر البريد غير مفعّلة على الخادم. إذا نسيت كلمة المرور، أنشئ حساباً جديداً أو تواصل مع مسؤول النظام.
    </p>
  </div>
<script>
let lang='ar';
const t={
  ar:{title:'استعادة كلمة المرور',sub:'أدخل بريدك وسنوضح لك الخطوة التالية',email:'البريد الإلكتروني',btn:'متابعة',back:'العودة لتسجيل الدخول',brand:'مركز التحكم',
    note:'حالياً إعادة التعيين عبر البريد غير مفعّلة على الخادم. إذا نسيت كلمة المرور، أنشئ حساباً جديداً أو تواصل مع مسؤول النظام.',
    ok:'تم استلام الطلب. تحقق من بريدك لاحقاً أو تواصل مع المسؤول.'},
  en:{title:'Reset password',sub:'Enter your email and we will guide the next step',email:'Email',btn:'Continue',back:'Back to sign in',brand:'Control Center',
    note:'Email password reset is not enabled on the server yet. Create a new account or contact the system admin.',
    ok:'Request received. Check your email later or contact the admin.'}
};
function toggleLang(){
  lang=lang==='ar'?'en':'ar';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('langBtn').textContent=lang==='ar'?'English':'العربية';
  const d=t[lang];
  document.getElementById('title').textContent=d.title;
  document.getElementById('subtitle').textContent=d.sub;
  document.getElementById('lblEmail').textContent=d.email;
  document.getElementById('btnText').textContent=d.btn;
  document.getElementById('backBtn').textContent=d.back;
  document.getElementById('brandSub').textContent=d.brand;
  document.getElementById('note').textContent=d.note;
}
document.getElementById('fpForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  if(!email) return;
  document.getElementById('okBox').textContent=t[lang].ok;
  document.getElementById('okBox').classList.add('show');
});
</script>
</body>
</html>
