<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B14;
      --card: #0F1629;
      --border: rgba(255,255,255,0.08);
      --primary: #6366F1;
      --primary-hover: #818CF8;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --danger: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .auth-wrap { width: 100%; max-width: 400px; position: relative; }
    .lang-btn {
      position: absolute;
      top: -8px;
      right: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .lang-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }
    html[dir="rtl"] .lang-btn {
      right: auto;
      left: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }
    .brand strong { display: block; font-size: 1rem; font-weight: 700; }
    .brand span { font-size: 0.7rem; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0A0F1A;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footer a { color: #818CF8; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
    .optional { color: #64748B; font-weight: 400; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <!-- زر تحويل اللغة -->
    <button type="button" class="lang-btn" id="langToggle">العربية</button>

    <div class="brand">
      <div class="brand-icon">🛡</div>
      <div>
        <strong>SENTINEL-AI</strong>
        <span data-i18n="brand_sub">Control Center</span>
      </div>
    </div>

    <div class="card">
      <h1 data-i18n="title">Create account</h1>
      <p class="sub" data-i18n="subtitle">Join SENTINEL-AI to save scans and alerts</p>

      <form id="registerForm">
        <label data-i18n="username">Username</label>
        <input type="text" name="username" autocomplete="username" required data-i18n-placeholder="ph_username" placeholder="Choose a username" />

        <label data-i18n="email">Email</label>
        <input type="email" name="email" autocomplete="email" required data-i18n-placeholder="ph_email" placeholder="you@example.com" />

        <label data-i18n="password">Password</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="8" data-i18n-placeholder="ph_password" placeholder="At least 8 characters" />

        <label><span data-i18n="first_name">First name</span> <span class="optional" data-i18n="optional">(optional)</span></label>
        <input type="text" name="first_name" data-i18n-placeholder="ph_optional" placeholder="Optional" />

        <label><span data-i18n="last_name">Last name</span> <span class="optional" data-i18n="optional">(optional)</span></label>
        <input type="text" name="last_name" data-i18n-placeholder="ph_optional" placeholder="Optional" />

        <button type="submit" class="btn btn-primary" data-i18n="btn_create">Create account</button>
        <a href="dashboard.html" class="btn btn-ghost" data-i18n="btn_guest">Continue as guest</a>
        <p class="error" id="registerError"></p>
      </form>
    </div>

    <div class="footer">
      <span data-i18n="have_account">Already have an account?</span> <a href="login.html" data-i18n="sign_in">Sign in</a>
    </div>
  </div>

  <script>
    // ===== Language System =====
    const translations = {
      en: {
        brand_sub: "Control Center",
        title: "Create account",
        subtitle: "Join SENTINEL-AI to save scans and alerts",
        username: "Username",
        email: "Email",
        password: "Password",
        first_name: "First name",
        last_name: "Last name",
        optional: "(optional)",
        btn_create: "Create account",
        btn_guest: "Continue as guest",
        have_account: "Already have an account?",
        sign_in: "Sign in",
        ph_username: "Choose a username",
        ph_email: "you@example.com",
        ph_password: "At least 8 characters",
        ph_optional: "Optional",
        lang_btn: "العربية"
      },
      ar: {
        brand_sub: "مركز التحكم",
        title: "إنشاء حساب",
        subtitle: "انضم إلى SENTINEL-AI لحفظ الفحوصات والتنبيهات",
        username: "اسم المستخدم",
        email: "البريد الإلكتروني",
        password: "كلمة المرور",
        first_name: "الاسم الأول",
        last_name: "اسم العائلة",
        optional: "(اختياري)",
        btn_create: "إنشاء حساب",
        btn_guest: "المتابعة كزائر",
        have_account: "لديك حساب بالفعل؟",
        sign_in: "تسجيل الدخول",
        ph_username: "اختر اسم مستخدم",
        ph_email: "you@example.com",
        ph_password: "8 أحرف على الأقل",
        ph_optional: "اختياري",
        lang_btn: "English"
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);

      const t = translations[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      // نصوص عادية
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      // الـ placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });

      // نص الزر
      document.getElementById('langToggle').textContent = t.lang_btn;
    }

    // تطبيق اللغة عند التحميل
    applyLanguage(currentLang);

    // زر التحويل
    document.getElementById('langToggle').addEventListener('click', () => {
      const next = currentLang === 'en' ? 'ar' : 'en';
      applyLanguage(next);
    });

    // ===== Register Form (نفس الكود الأصلي) =====
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('registerError');
      errorEl.textContent = '';

      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        first_name: form.first_name.value.trim() || null,
        last_name: form.last_name.value.trim() || null
      };

      try {
        // === اربط هنا API التسجيل تبعك ===
        // const res = await fetch('/api/auth/register', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify(payload)
        // });
        // const data = await res.json();
        // if (!res.ok) throw new Error(data.message || 'Registration failed');
        // localStorage.setItem('token', data.token);

        console.log('Register:', payload);
        localStorage.setItem('token', 'demo-token');
        localStorage.setItem('user', JSON.stringify({ username: payload.username }));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Something went wrong';
      }
    });
  </script>
</body>
</html>
