<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | SENTINEL-AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body.auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0B1426;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #111C33;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 32px;
      color: #fff;
    }
    .auth-card h3 { margin: 0 0 8px; font-size: 1.4rem; }
    .auth-card p { margin: 0 0 24px; color: #94a3b8; font-size: 0.9rem; }
    .auth-card label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
    .auth-card input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1A2744;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .auth-card input:focus { outline: none; border-color: #6366f1; }
    .form-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-primary { background: #6366f1; color: #fff; flex: 1; }
    .btn-primary:hover { background: #818cf8; }
    .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.12); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }
    .form-error { color: #f87171; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
    .auth-footer { margin-top: 24px; text-align: center; font-size: 0.85rem; color: #64748b; }
    .auth-footer a { color: #818cf8; text-decoration: none; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
    .brand-mark { font-size: 1.6rem; }
    .brand strong { display: block; font-size: 0.95rem; }
    .brand small { color: #64748b; font-size: 0.7rem; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">🛡️</span>
      <div>
        <strong>SENTINEL-AI</strong>
        <small>Control Center</small>
      </div>
    </div>

    <h3>Create account</h3>
    <p>Join SENTINEL-AI to save your scans and alerts.</p>

    <form id="registerForm">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" required placeholder="Choose a username" />

      <label>Email</label>
      <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />

      <label>Password</label>
      <input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 chars, mixed case + digit" />

      <label>First name <span style="color:#64748b;font-weight:400">(optional)</span></label>
      <input type="text" name="first_name" placeholder="Optional" />

      <label>Last name <span style="color:#64748b;font-weight:400">(optional)</span></label>
      <input type="text" name="last_name" placeholder="Optional" />

      <!-- ملاحظة: ما في أي رابط "نسيت كلمة المرور" هنا -->

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create account</button>
        <button type="button" class="btn btn-secondary" onclick="location.href='/dashboard'">Continue as guest</button>
      </div>
      <p class="form-error" id="registerError"></p>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      // حط كود الـ register API تبعك هنا
      console.log('Register submitted');
    });
  </script>
</body>
</html>
