<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | SENTINEL-AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B14;
      --card: #0F1629;
      --border: rgba(255,255,255,0.08);
      --primary: #6366F1;
      --primary-hover: #818CF8;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --danger: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .auth-wrap { width: 100%; max-width: 400px; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }
    .brand strong { display: block; font-size: 1rem; font-weight: 700; }
    .brand span { font-size: 0.7rem; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0A0F1A;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      text-align: center;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footer a { color: #818CF8; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
    .optional { color: #64748B; font-weight: 400; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-icon">🛡</div>
      <div>
        <strong>SENTINEL-AI</strong>
        <span>Control Center</span>
      </div>
    </div>

    <div class="card">
      <h1>Create account</h1>
      <p class="sub">Join SENTINEL-AI to save scans and alerts</p>

      <form id="registerForm">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required placeholder="Choose a username" />

        <label>Email</label>
        <input type="email" name="email" autocomplete="email" required placeholder="you@example.com" />

        <label>Password</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />

        <label>First name <span class="optional">(optional)</span></label>
        <input type="text" name="first_name" placeholder="Optional" />

        <label>Last name <span class="optional">(optional)</span></label>
        <input type="text" name="last_name" placeholder="Optional" />

        <!-- ملاحظة: ما في رابط نسيت كلمة المرور هنا -->

        <button type="submit" class="btn btn-primary">Create account</button>
        <a href="dashboard.html" class="btn btn-ghost">Continue as guest</a>
        <p class="error" id="registerError"></p>
      </form>
    </div>

    <div class="footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('registerError');
      errorEl.textContent = '';

      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        first_name: form.first_name.value.trim() || null,
        last_name: form.last_name.value.trim() || null
      };

      try {
        // === اربط هنا API التسجيل تبعك ===
        // const res = await fetch('/api/auth/register', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify(payload)
        // });
        // const data = await res.json();
        // if (!res.ok) throw new Error(data.message || 'Registration failed');
        // localStorage.setItem('token', data.token);

        console.log('Register:', payload);
        localStorage.setItem('token', 'demo-token');
        localStorage.setItem('user', JSON.stringify({ username: payload.username }));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Something went wrong';
      }
    });
  </script>
</body>
</html>
